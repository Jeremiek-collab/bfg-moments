<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Cinzel:wght@500;700&amp;display=swap');
      .logo-circle { fill: #08080a; }
      .logo-text-bg {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', serif;
        font-weight: 700;
        fill: #ffffff;
        font-size: 165px;
        letter-spacing: 2px;
      }
      .logo-text-sub {
        font-family: 'Cinzel', 'Playfair Display', serif;
        font-weight: 600;
        fill: #ffffff;
        font-size: 26px;
        letter-spacing: 14px;
        text-transform: uppercase;
      }
    </style>
  </defs>
  
  <!-- Outer Dark Circle -->
  <circle class="logo-circle" cx="250" cy="250" r="240" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  
  <!-- Big B F G Letters -->
  <text x="250" y="295" text-anchor="middle" class="logo-text-bg">B F G</text>
  
  <!-- Subtitle MOMENT in center -->
  <text x="256" y="260" text-anchor="middle" class="logo-text-sub">MOMENT</text>
</svg>
